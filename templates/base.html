<!DOCTYPE html>
{% load static %}
<html lang="ru" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AskPupkin{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'questions/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'questions/css/style.css' %}">
    <link rel="shortcut icon" href="{% static 'questions/img/favicon.ico' %}" type="image/x-icon">
</head>
<body class="d-flex flex-column h-100 bg-light">

    <header class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'questions:index' %}">AskPupkin</a>
            <div class="collapse navbar-collapse" id="navbarContent">
                <form class="d-flex mx-auto w-50">
                    <input class="form-control me-2" type="search" placeholder="Поиск...">
                    <button class="btn btn-outline-success" type="submit">Найти</button>
                </form>

                <div class="d-flex align-items-center text-white">
                    <img src="{% static 'questions/img/avatar-placeholder.png' %}" class="rounded-circle me-2" width="40">
                    <a href="{% url 'core:profile' %}" class="text-white me-3 text-decoration-none small">Dr. House</a>
                    <a href="{% url 'core:login' %}" class="btn btn-outline-light btn-sm me-2">Выход</a>
                    <a href="{% url 'questions:ask' %}" class="btn btn-primary btn-sm">Задать вопрос</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-shrink-0">
        <div class="container">
            <div class="row">
                <div class="col-lg-9">
                    {% block content %}{% endblock %}
                </div>

                <aside class="col-lg-3">
                    <div class="card mb-4 shadow-sm">
                        <div class="card-header bg-white"><h5>Популярные теги</h5></div>
                        <div class="card-body">
                            <a href="{% url 'questions:tag' tag_name='python' %}" class="badge bg-secondary text-decoration-none">python</a>
                            <a href="{% url 'questions:tag' tag_name='django' %}" class="badge bg-secondary text-decoration-none">django</a>
                        </div>
                    </div>
                     <div class="card shadow-sm">
                        <div class="card-header bg-white">
                            <h5 class="card-title mb-0">Лучшие пользователи</h5>
                        </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <a href="#" class="text-decoration-none">Mr. Freeman</a>
                                <span class="badge bg-primary rounded-pill">1240</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <a href="#" class="text-decoration-none">Dr.House</a>
                                <span class="badge bg-primary rounded-pill">950</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <a href="#" class="text-decoration-none">V.Pupkin</a>
                                <span class="badge bg-primary rounded-pill">820</span>
                            </li>
                        </ul>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="footer mt-auto py-3 bg-white border-top text-center">
        <span class="text-muted">© 2026 AskPupkin. VK Education.</span>
    </footer>

    <script src="{% static 'questions/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
