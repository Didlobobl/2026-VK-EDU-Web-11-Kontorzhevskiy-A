proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=mycache:10m max_size=1g inactive=60m use_temp_path=off;

upstream gunicorn_app {
    server 127.0.0.1:8080; 
}

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/javascript image/jpeg image/png;

    location ^~ /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(js|css|jpeg|jpg|png|gif|webp|html)$ {
        root /app
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://gunicorn_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Кэширование
        proxy_cache mycache;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }
}