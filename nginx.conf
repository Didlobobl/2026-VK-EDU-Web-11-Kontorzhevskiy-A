proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=128m inactive=60m;

upstream gunicorn {
    server web:8080;
}

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/javascript image/jpeg image/png;

    # 1. Папка /uploads/ (Пункт 5)
    location ^~ /uploads/ {
        alias /app/uploads/;
        expires 30d;
    }

    location ^~ /static/ {
        alias /app/static/;
        expires 30d;
    }

    location ~* \.(js|css|jpeg|jpg|png|gif|webp|ico|html|svg)$ {
        root /app/static;
        expires 30d;
    }

    location / {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        proxy_cache my_cache;
        proxy_cache_valid 200 10m;
    }
}