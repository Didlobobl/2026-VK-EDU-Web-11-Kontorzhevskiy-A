{% load static %}
<div class="card mb-4 shadow-sm">
    <div class="card-body">
        <div class="row">
            <div class="col-md-2 text-center border-end btn-group-vote">
                <img src="{% static 'questions/img/avatar-placeholder.png' %}" class="img-fluid rounded mb-2" style="max-width: 64px;">
                <div class="d-flex flex-column align-items-center">
                    <button class="btn btn-outline-success btn-sm like-btn mb-1" 
                            data-id="{{ question.id }}" 
                            data-type="question" 
                            data-action="like"
                            {% if not user.is_authenticated %}disabled title="Войдите, чтобы голосовать"{% endif %}>+
                    </button>
                    <span class="fw-bold rating-counter" id="rating-question-{{ question.id }}">
                        {{ question.get_rating }}
                    </span>
                    <button class="btn btn-outline-danger btn-sm dislike-btn mt-1" 
                            data-id="{{ question.id }}" 
                            data-type="question" 
                            data-action="dislike"
                            {% if not user.is_authenticated %}disabled title="Войдите, чтобы голосовать"{% endif %}>-
                    </button>
                </div>
            </div>
            <div class="col-md-10">
                <h4><a href="{% url 'questions:question' question_id=question.id %}" class="text-decoration-none">{{ question.title }}</a></h4>
                <p class="card-text">{{ question.content|truncatechars:150 }}</p>
                <div class="d-flex justify-content-between mt-3">
                    <div>
                        {% for tag in question.tags.all %}
                            <a href="{% url 'questions:tag' tag_name=tag.name %}" class="badge bg-info text-dark">
                                {{ tag.name }}
                            </a>
                        {% endfor %}
                    </div>
                    <div class="small text-muted">
                        Ответы ({{ question.answers.count }})
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
